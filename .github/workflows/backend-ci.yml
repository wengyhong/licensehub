name: Backend and Client CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode -no-transfer-progress clean verify

      - name: Restore .NET projects
        run: |
          dotnet restore clients/LicenseHub.Client.Tests/LicenseHub.Client.Tests.csproj
          dotnet restore clients/LicenseHub.ActivationDemo/LicenseHub.ActivationDemo.csproj

      - name: Run .NET client tests
        run: >-
          dotnet test
          clients/LicenseHub.Client.Tests/LicenseHub.Client.Tests.csproj
          --configuration Release
          --no-restore

      - name: Build .NET activation demo
        run: >-
          dotnet build
          clients/LicenseHub.ActivationDemo/LicenseHub.ActivationDemo.csproj
          --configuration Release
          --no-restore

      - name: Build Docker image
        run: docker build --tag licensehub-api:ci .
